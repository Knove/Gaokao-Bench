<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Gaokao-Bench: Measuring AI Intelligence with China's National Exam</title>
  <desc id="desc">A cream editorial banner highlighting China's national Gaokao exam as a high-stakes, dynamically evolving ruler for AI intelligence.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E7DCC8" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2A1D10" flood-opacity="0.16"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2A1D10" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="#F7F1E5"/>
  <rect width="1600" height="620" fill="url(#grid)" opacity="0.62"/>
  <rect x="0" y="0" width="16" height="620" fill="#C8281C"/>

  <g>
    <rect x="96" y="64" width="68" height="32" rx="8" fill="#C8281C"/>
    <text x="130" y="86" fill="#FFFFFF" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">高考</text>
    <text x="180" y="86" fill="#B03B2B" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="16" font-weight="750" letter-spacing="3.4">CHINA'S NATIONAL EXAM · AI INTELLIGENCE BENCHMARK</text>
  </g>

  <text x="94" y="206" fill="#171513" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="72" font-weight="820" letter-spacing="-2.8">National Exam Standard.</text>
  <text x="94" y="294" fill="#171513" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="72" font-weight="820" letter-spacing="-2.8">Evolving Difficulty.</text>
  <text x="94" y="382" fill="#C8281C" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="72" font-weight="820" letter-spacing="-2.8">Real Exam Scores.</text>

  <text x="96" y="444" fill="#3A342C" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" font-weight="500">Gaokao is China's definitive university entrance exam—built to separate top-tier</text>
  <text x="96" y="478" fill="#3A342C" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" font-weight="500">reasoning from rote memorization, evolving every year with exact point-weighted scoring.</text>

  <g font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="15.5" font-weight="700">
    <rect x="96" y="526" width="154" height="43" rx="21.5" fill="#C8281C"/>
    <text x="173" y="553" fill="#FFF9EF" text-anchor="middle">1977–Present</text>
    <rect x="262" y="526" width="166" height="43" rx="21.5" fill="#171513"/>
    <text x="345" y="553" fill="#FFF9EF" text-anchor="middle">Real Point Weights</text>
    <rect x="440" y="526" width="174" height="43" rx="21.5" fill="#E9DFCD" stroke="#CDBFA8"/>
    <text x="527" y="553" fill="#231F1A" text-anchor="middle">Fixed Denominator</text>
    <rect x="626" y="526" width="156" height="43" rx="21.5" fill="#F7E2DD" stroke="#EABCB3"/>
    <text x="704" y="553" fill="#A93426" text-anchor="middle">0 LLM Judges</text>
  </g>

  <g opacity="0.20">
    <circle cx="944" cy="310" r="212" fill="none" stroke="#A93628" stroke-width="2"/>
    <circle cx="944" cy="310" r="150" fill="none" stroke="#A93628" stroke-width="1.5" stroke-dasharray="7 9"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1112" y="107" width="340" height="420" rx="28" fill="#E9D8BF" transform="rotate(9 1282 317)"/>
    <rect x="1052" y="126" width="365" height="430" rx="28" fill="#F2E7D5" stroke="#D1C0A8" transform="rotate(-6 1234 341)"/>
    <g transform="rotate(2 1275 320)">
      <rect x="1080" y="105" width="392" height="444" rx="29" fill="#FFFDF8" stroke="#171513" stroke-width="3"/>
      <path d="M1110 157V132H1135" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1418 132H1443V157" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1110 485V510H1135" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1443 485V510H1418" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1114" y="156" width="60" height="26" rx="6" fill="#C8281C"/>
      <text x="1144" y="174" fill="#FFFFFF" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">高考</text>
      <text x="1186" y="174" fill="#746B5E" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="13" font-weight="750" letter-spacing="1.8">NATIONAL EXAM PAPER</text>
      <text x="1112" y="270" fill="#C8281C" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="82" font-weight="800">750</text>
      <text x="1272" y="264" fill="#746B5E" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="16" font-weight="750">GAOKAO SCALE</text>
      <line x1="1114" y1="294" x2="1438" y2="294" stroke="#D9CDBA" stroke-width="2"/>

      <g font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="18" font-weight="750">
        <circle cx="1138" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1138" y="356" fill="#5B5348" text-anchor="middle">A</text>
        <circle cx="1221" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1221" y="356" fill="#5B5348" text-anchor="middle">B</text>
        <circle cx="1304" cy="349" r="22" fill="#C8281C"/>
        <path d="M1294 349L1301 356L1315 341" fill="none" stroke="#FFF9EF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="1387" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1387" y="356" fill="#5B5348" text-anchor="middle">D</text>
      </g>

      <rect x="1114" y="397" width="320" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1114" y="422" width="276" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1114" y="447" width="226" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1285" y="474" width="149" height="34" rx="17" fill="#E2F1EC"/>
      <text x="1359.5" y="497" fill="#176557" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="13" font-weight="750" text-anchor="middle">POINT-WEIGHTED</text>
    </g>
  </g>

  <g filter="url(#badgeShadow)">
    <rect x="955" y="492" width="255" height="54" rx="27" fill="#171513"/>
    <circle cx="986" cy="519" r="10" fill="#4DB39E"/>
    <text x="1008" y="525" fill="#FFF9EF" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="14.5" font-weight="750" letter-spacing="0.8">REPRODUCIBLE SCORES</text>
  </g>
</svg>
