<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Gaokao-Bench: real exams, fixed denominators, reproducible scores</title>
  <desc id="desc">A cream editorial banner with strong typography, benchmark statistics, and a stylised answer card marked with a red check.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E7DCC8" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2A1D10" flood-opacity="0.16"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2A1D10" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="#F7F1E5"/>
  <rect width="1600" height="620" fill="url(#grid)" opacity="0.62"/>
  <rect x="0" y="0" width="16" height="620" fill="#D6422B"/>

  <text x="96" y="92" fill="#B03B2B" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="17" font-weight="750" letter-spacing="4.1">CHINESE GAOKAO / OBJECTIVE / 2025</text>
  <text x="94" y="216" fill="#171513" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="78" font-weight="820" letter-spacing="-3">Real exams.</text>
  <text x="94" y="301" fill="#171513" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="78" font-weight="820" letter-spacing="-3">Fixed denominators.</text>
  <text x="94" y="386" fill="#C83D2B" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="78" font-weight="820" letter-spacing="-3">Reproducible scores.</text>
  <text x="96" y="448" fill="#3A342C" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" font-weight="500">A deterministic, point-weighted benchmark for AI systems</text>
  <text x="96" y="480" fill="#3A342C" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="21" font-weight="500">on real Chinese Gaokao objective questions.</text>

  <g font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="16" font-weight="700">
    <rect x="96" y="528" width="126" height="43" rx="21.5" fill="#171513"/>
    <text x="159" y="556" fill="#FFF9EF" text-anchor="middle">5 papers</text>
    <rect x="234" y="528" width="126" height="43" rx="21.5" fill="#E9DFCD" stroke="#CDBFA8"/>
    <text x="297" y="556" fill="#231F1A" text-anchor="middle">74 items</text>
    <rect x="372" y="528" width="136" height="43" rx="21.5" fill="#E9DFCD" stroke="#CDBFA8"/>
    <text x="440" y="556" fill="#231F1A" text-anchor="middle">353 points</text>
    <rect x="520" y="528" width="156" height="43" rx="21.5" fill="#F7E2DD" stroke="#EABCB3"/>
    <text x="598" y="556" fill="#A93426" text-anchor="middle">0 LLM judges</text>
  </g>

  <g opacity="0.20">
    <circle cx="944" cy="310" r="212" fill="none" stroke="#A93628" stroke-width="2"/>
    <circle cx="944" cy="310" r="150" fill="none" stroke="#A93628" stroke-width="1.5" stroke-dasharray="7 9"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1112" y="107" width="340" height="420" rx="28" fill="#E9D8BF" transform="rotate(9 1282 317)"/>
    <rect x="1052" y="126" width="365" height="430" rx="28" fill="#F2E7D5" stroke="#D1C0A8" transform="rotate(-6 1234 341)"/>
    <g transform="rotate(2 1275 320)">
      <rect x="1080" y="105" width="392" height="444" rx="29" fill="#FFFDF8" stroke="#171513" stroke-width="3"/>
      <path d="M1110 157V132H1135" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1418 132H1443V157" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1110 485V510H1135" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1443 485V510H1418" fill="none" stroke="#171513" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1115" y="181" fill="#746B5E" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="13" font-weight="750" letter-spacing="2.2">SECTION A / OBJECTIVE</text>
      <text x="1112" y="270" fill="#D6422B" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="82" font-weight="800">01</text>
      <line x1="1114" y1="294" x2="1438" y2="294" stroke="#D9CDBA" stroke-width="2"/>

      <g font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="18" font-weight="750">
        <circle cx="1138" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1138" y="356" fill="#5B5348" text-anchor="middle">A</text>
        <circle cx="1221" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1221" y="356" fill="#5B5348" text-anchor="middle">B</text>
        <circle cx="1304" cy="349" r="22" fill="#D6422B"/>
        <path d="M1294 349L1301 356L1315 341" fill="none" stroke="#FFF9EF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="1387" cy="349" r="21" fill="#F5EDDF" stroke="#BEB09A" stroke-width="2"/>
        <text x="1387" y="356" fill="#5B5348" text-anchor="middle">D</text>
      </g>

      <rect x="1114" y="397" width="320" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1114" y="422" width="276" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1114" y="447" width="226" height="10" rx="5" fill="#EAE0D0"/>
      <rect x="1301" y="474" width="133" height="34" rx="17" fill="#E2F1EC"/>
      <text x="1367.5" y="497" fill="#176557" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="13" font-weight="750" text-anchor="middle">5 POINTS</text>
    </g>
  </g>

  <g filter="url(#badgeShadow)">
    <rect x="973" y="492" width="235" height="54" rx="27" fill="#171513"/>
    <circle cx="1002" cy="519" r="10" fill="#4DB39E"/>
    <text x="1023" y="525" fill="#FFF9EF" font-family="Inter, 'SF Pro Text', 'Segoe UI', 'Noto Sans', sans-serif" font-size="15" font-weight="750" letter-spacing="0.8">FIXED DENOMINATOR</text>
  </g>
</svg>
