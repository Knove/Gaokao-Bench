<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Gaokao-Bench：用高考真题衡量 AI 智力</title>
  <desc id="desc">深色中文主视觉，突出全国选拔标尺、历年动态演进与真实卷面分值评测。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A2E32" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1600" height="620" fill="#101214"/>
  <rect width="1600" height="620" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="16" height="620" fill="#E54333"/>

  <g>
    <rect x="96" y="64" width="68" height="32" rx="8" fill="#E54333"/>
    <text x="130" y="86" fill="#FFFFFF" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">高考</text>
    <text x="178" y="86" fill="#FF8474" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="750" letter-spacing="3.2">国家级选拔真题 · 持续演进的 AI 智力标尺</text>
  </g>

  <text x="94" y="206" fill="#F7F2E8" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="74" font-weight="850" letter-spacing="-2">全国选拔标尺。</text>
  <text x="94" y="294" fill="#F7F2E8" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="74" font-weight="850" letter-spacing="-2">历年动态演进。</text>
  <text x="94" y="382" fill="#F05A43" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="74" font-weight="850" letter-spacing="-2">真实卷面评测。</text>

  <text x="96" y="444" fill="#C9C3B8" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">高考是中国最具代表性的高区分度选拔考试，命题随时代持续反套路演进。</text>
  <text x="96" y="478" fill="#C9C3B8" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">Gaokao-Bench 还原真实卷面分值与确定性判分，直测大模型硬核推理上限。</text>

  <g font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700">
    <rect x="96" y="526" width="144" height="43" rx="21.5" fill="#E54333"/>
    <text x="168" y="553" fill="#FFFFFF" text-anchor="middle">1977–至今演进</text>
    <rect x="252" y="526" width="146" height="43" rx="21.5" fill="#F7F2E8"/>
    <text x="325" y="553" fill="#151719" text-anchor="middle">真实卷面分值</text>
    <rect x="410" y="526" width="146" height="43" rx="21.5" fill="#23272B" stroke="#3E444A"/>
    <text x="483" y="553" fill="#E9E4DB" text-anchor="middle">固定总分分母</text>
    <rect x="568" y="526" width="166" height="43" rx="21.5" fill="#3A211E" stroke="#70372F"/>
    <text x="651" y="553" fill="#FF9C89" text-anchor="middle">零裁判模型确定判分</text>
  </g>

  <g opacity="0.28">
    <circle cx="944" cy="310" r="212" fill="none" stroke="#F05A43" stroke-width="2"/>
    <circle cx="944" cy="310" r="150" fill="none" stroke="#F05A43" stroke-width="1.5" stroke-dasharray="7 9"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1112" y="107" width="340" height="420" rx="28" fill="#272019" transform="rotate(9 1282 317)"/>
    <rect x="1052" y="126" width="365" height="430" rx="28" fill="#20252A" stroke="#41474D" transform="rotate(-6 1234 341)"/>
    <g transform="rotate(2 1275 320)">
      <rect x="1080" y="105" width="392" height="444" rx="29" fill="#181C20" stroke="#F0E8DA" stroke-width="3"/>
      <path d="M1110 157V132H1135" fill="none" stroke="#F0E8DA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1418 132H1443V157" fill="none" stroke="#F0E8DA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1110 485V510H1135" fill="none" stroke="#F0E8DA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1443 485V510H1418" fill="none" stroke="#F0E8DA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1114" y="156" width="60" height="26" rx="6" fill="#E54333"/>
      <text x="1144" y="174" fill="#FFFFFF" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">高考</text>
      <text x="1186" y="174" fill="#9EA4AA" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="750" letter-spacing="1.8">全国统考真题卷</text>
      <text x="1112" y="270" fill="#F05A43" font-family="Inter, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="82" font-weight="800">750</text>
      <text x="1272" y="264" fill="#9EA4AA" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">高考标尺体系</text>
      <line x1="1114" y1="294" x2="1438" y2="294" stroke="#3E444A" stroke-width="2"/>

      <g font-family="Inter, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="18" font-weight="750">
        <circle cx="1138" cy="349" r="21" fill="#242A2F" stroke="#626A72" stroke-width="2"/>
        <text x="1138" y="356" fill="#B6BDC3" text-anchor="middle">A</text>
        <circle cx="1221" cy="349" r="21" fill="#242A2F" stroke="#626A72" stroke-width="2"/>
        <text x="1221" y="356" fill="#B6BDC3" text-anchor="middle">B</text>
        <circle cx="1304" cy="349" r="22" fill="#F05A43"/>
        <path d="M1294 349L1301 356L1315 341" fill="none" stroke="#1A1714" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="1387" cy="349" r="21" fill="#242A2F" stroke="#626A72" stroke-width="2"/>
        <text x="1387" y="356" fill="#B6BDC3" text-anchor="middle">D</text>
      </g>

      <rect x="1114" y="397" width="320" height="10" rx="5" fill="#2B3136"/>
      <rect x="1114" y="422" width="276" height="10" rx="5" fill="#2B3136"/>
      <rect x="1114" y="447" width="226" height="10" rx="5" fill="#2B3136"/>
      <rect x="1285" y="474" width="149" height="34" rx="17" fill="#173B34"/>
      <text x="1359.5" y="496" fill="#77D0BE" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="750" text-anchor="middle">按真实题分赋分</text>
    </g>
  </g>

  <g filter="url(#badgeShadow)">
    <rect x="955" y="492" width="255" height="54" rx="27" fill="#F7F2E8"/>
    <circle cx="986" cy="519" r="10" fill="#1F7A68"/>
    <text x="1008" y="525" fill="#151719" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="750" letter-spacing="0.8">真实分值 · 结果可复现</text>
  </g>
</svg>
