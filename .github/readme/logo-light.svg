<svg xmlns="http://www.w3.org/2000/svg" width="600" height="144" viewBox="0 0 600 144" role="img" aria-labelledby="title desc">
  <title id="title">Gaokao-Bench logo</title>
  <desc id="desc">A crimson Gaokao emblem with bold white Chinese characters for Gaokao, paired with the Gaokao-Bench wordmark.</desc>
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D93829"/>
      <stop offset="100%" stop-color="#B01F14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8A1C12" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="124" height="124" rx="26" fill="url(#crimsonGrad)"/>
    <rect x="18" y="18" width="108" height="108" rx="20" fill="none" stroke="#FFF8F0" stroke-width="1.8" stroke-opacity="0.45"/>
    <path d="M27 39V27H39" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 27H117V39" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 105V117H39" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M117 105V117H105" fill="none" stroke="#FFF8F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="79" fill="#FFFFFF" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Serif CJK SC', 'Songti SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="2">高考</text>
    <rect x="40" y="95" width="64" height="16" rx="8" fill="#FFF8F0" fill-opacity="0.18"/>
    <text x="72" y="106.5" fill="#FFF8F0" font-family="Inter, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="2.2">BENCH</text>
  </g>
  <text x="158" y="72" fill="#171513" font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Noto Sans', sans-serif" font-size="47" font-weight="800" letter-spacing="-1.2">Gaokao-Bench</text>
  <text x="160" y="103" fill="#C42B1C" font-family="'PingFang SC', 'Noto Sans SC', Inter, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">中国高考真题 · AI 智力评测基准</text>
