<text x="220" y="366" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="450" letter-spacing="0.15">小申同学观察发现，生活中有时候影子可以完全投射在斜面上。</text>
<text x="220" y="403" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="450" letter-spacing="0.15">某斜面上有两根长为 1 m 且垂直于水平面放置的杆子，</text>
<text x="220" y="440" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="450" letter-spacing="0.15">与斜面的接触点分别为 A、B，它们在阳光的照射下呈现出影子，</text>
<text x="220" y="477" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="450" letter-spacing="0.15">阳光可视为平行光。其中 A 处杆子的影子在水平面上，长度为 0.4 米，</text>
<text x="220" y="514" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="450" letter-spacing="0.15">B 处杆子的影子完全在斜面上，长度为 0.45 米。</text>
<text x="220" y="551" fill="#C7C1B7" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="20.5" font-weight="750" letter-spacing="0.15">则斜面的坡角 θ = ______。（结果精确到 0.01°）</text>
  </g>

