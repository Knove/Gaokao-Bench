name: Contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit contract (no data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest -m "not public_data and not source_release"

  public-data:
    name: Public-data contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install data and test dependencies
        run: python -m pip install -e ".[harness,data]" pytest
      - name: Resolve the pinned dataset version
        id: dataset
        run: |
          version="$(python -c 'from gaokao_bench.version import DEFAULT_DATASET_VERSION; print(DEFAULT_DATASET_VERSION)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Fetch the immutable public package
        run: python -m gaokao_bench.cli fetch-data --version "${{ steps.dataset.outputs.version }}"
      - name: Run data-independent tests again against the fetched tree
        run: python -m pytest -m "not public_data and not source_release"
      - name: Run public-data contract tests
        run: python -m pytest -m public_data
